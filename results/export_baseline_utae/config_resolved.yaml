experiment_name: baseline_utae_lightning
smoke: false
seed: 42
seed_workers: true
data:
  dataset: bradd
  root: /teamspace/studios/this_studio/vana-drishti/data/BraDD-S1TS_zenodo
  split_column: close_set
  stats_path: /teamspace/studios/this_studio/vana-drishti/data/BraDD-S1TS_zenodo/close_stats.pt
  normalization: zscore
  batch_size: 4
  num_workers: 4
  temporal_subsample:
    mode: none
    num_dates: -1
    at_test: false
  max_samples:
    train: null
    validation: null
    test: null
  per_region_norm:
    enabled: false
    region_column: state
    stats_path: data/BraDD-S1TS/vanadrishti_close_train_region_stats.pt
    unseen_region: global
    self_normalise_regions: []
  seasonal_window:
    enabled: false
    start: 06-01
    end: 10-31
    on_empty: error
  crop:
    enabled: false
    size: 32
    mode: center
    input_size: 48
  label_source: prodes
  inspect:
    out_dir: results/phase0_inspection
    n_samples: 500
    seed: 42
    shipped_stats_name: close_stats.pt
    paper_split_counts:
      train: 15625
      validation: 5251
      test: 5112
    notebook_split_counts:
      train: 15625
      validation: 5112
      test: 5251
    geo_pattern: lat|lon|^x$|^y$|geom|crs|coord|bound|transform
    geo_extensions:
    - .geojson
    - .json
    - .shp
    - .gpkg
    - .kml
    - .csv
    - .tif
    - .tiff
model:
  name: utae
  forward_type: segment
  error_days_before: 30
  error_days_after: 30
  inclusive_end: false
  params:
    input_dim: 2
    encoder_widths:
    - 64
    - 64
    - 64
    - 128
    decoder_widths:
    - 32
    - 32
    - 64
    - 128
    out_conv:
    - 32
    - 2
    str_conv_k: 4
    str_conv_s: 2
    str_conv_p: 1
    agg_mode: att_group
    encoder_norm: group
    n_head: 8
    d_model: 256
    d_k: 4
    pad_value: 0
    padding_mode: reflect
    positional_encoding_period: 1000
loss:
  name: cross_entropy
train:
  init_checkpoint: null
  validation_prefix: none
  resume: true
optim:
  name: adamw
  lr: 0.001
  weight_decay: 1.0e-06
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  scheduler:
    name: reduce_on_plateau
    monitor: validation/pixel_iou
    mode: max
    patience: 10
    factor: 0.1
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 0.0
trainer:
  max_epochs: 200
  max_time:
    days: 6
    hours: 23
  precision: 32
  accelerator: gpu
  deterministic: false
  num_sanity_val_steps: 0
  enable_progress_bar: true
  log_every_n_steps: 50
  float32_matmul_precision: medium
  early_stopping:
    monitor: validation/pixel_iou
    mode: max
    patience: 30
    min_delta: 0.001
  checkpoint:
    monitor: validation/pixel_iou
    mode: max
    save_top_k: 1
output:
  runs_dir: results/runs
logging:
  csv: true
  tensorboard: false
  wandb: false
reference:
  split: close
  normalization_method: ZScore
  temporal_dropout:
    is_random: false
    num_temporal: -1
  save_outputs: false
