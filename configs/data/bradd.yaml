# BraDD-S1TS data config (Phase 1/2). Paths are relative to the repo root.
dataset: bradd
root: data/BraDD-S1TS            # folder holding meta.csv and Samples/ after unzip (confirm with inspect_bradd.py)
split_column: close_set          # fixed split shipped in meta.csv (PRD 4.2)
stats_path: data/BraDD-S1TS/vanadrishti_close_train_stats.pt  # our train-only stats cache (not upstream close_stats.pt)
# If the archive ships `close_stats.pt` (inspect_bradd.py reports it and compares it with ours), set
# stats_path: data/BraDD-S1TS/close_stats.pt so our pipeline and the upstream reference run normalise identically
# (a file that exists is loaded as is, never recomputed or overwritten).
normalization: zscore            # zscore | none
batch_size: 4
num_workers: 4
temporal_subsample:
  mode: none                     # none | uniform | random | last_only
  num_dates: -1                  # >= 2 for uniform/random; ignored for none/last_only
  at_test: false                 # upstream applies TemporalDropout to train/validation only
max_samples:                     # null = all rows; small ints only for SMOKE runs
  train: null
  validation: null
  test: null

per_region_norm:                 # PRD 4.3 (SN-TUNet); replaces the global Z-score when enabled
  enabled: false
  region_column: state           # Brazilian state in BraDD meta.csv
  stats_path: data/BraDD-S1TS/vanadrishti_close_train_region_stats.pt
  unseen_region: global          # global | self | error, for regions without train rows
  self_normalise_regions: []     # regions always normalised from their own (unlabelled) images
seasonal_window:                 # PRD 4.3; filters images only, labels intact; applied before temporal_subsample
  enabled: false
  start: "06-01"                 # MM-DD; start > end wraps the year end
  end: "10-31"
  on_empty: error                # error | skip (skip drops such samples when the dataset is built)
crop:                            # PRD Phase 6 smaller patches
  enabled: false
  size: 32                       # 32 | 16
  mode: center                   # center | random (train only; center elsewhere) | tile (48/16 -> 9 disjoint, 48/32 -> 4 overlapping corners)
  input_size: 48
label_source: prodes             # prodes (sample key `label`) | hansen (`label_hansen`); or {train: .., validation: .., test: ..}

# Phase 0 read-only inspection (scripts/inspect_bradd.py).
inspect:
  out_dir: results/phase0_inspection
  n_samples: 500                 # sample files opened for keys/shapes/dB ranges; -1 = all
  seed: 42
  shipped_stats_name: close_stats.pt  # upstream's cache name (`<split>_stats.pt` in the dataset root)
  paper_split_counts: {train: 15625, validation: 5251, test: 5112}      # Karaman et al. 2023
  notebook_split_counts: {train: 15625, validation: 5112, test: 5251}   # upstream DatasetAnalysis.ipynb
  geo_pattern: "lat|lon|^x$|^y$|geom|crs|coord|bound|transform"
  geo_extensions: [".geojson", ".json", ".shp", ".gpkg", ".kml", ".csv", ".tif", ".tiff"]
