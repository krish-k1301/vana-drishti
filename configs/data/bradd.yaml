# BraDD-S1TS data config (Phase 1/2). Paths are relative to the repo root.
dataset: bradd
root: data/BraDD-S1TS            # folder holding meta.csv and Samples/ after unzip (confirm with inspect_bradd.py)
split_column: close_set          # fixed split shipped in meta.csv (PRD 4.2)
stats_path: data/BraDD-S1TS/vanadrishti_close_train_stats.pt  # our train-only stats cache (not upstream close_stats.pt)
normalization: zscore            # zscore | none
batch_size: 4
num_workers: 4
seed: 42
temporal_subsample:
  mode: none                     # none | uniform | random | last_only
  num_dates: -1                  # >= 2 for uniform/random; ignored for none/last_only
  at_test: false                 # upstream applies TemporalDropout to train/validation only
max_samples:                     # null = all rows; small ints only for SMOKE runs
  train: null
  validation: null
  test: null

# Phase 0 read-only inspection (scripts/inspect_bradd.py).
inspect:
  out_dir: results/phase0_inspection
  n_samples: 500                 # sample files opened for keys/shapes/dB ranges; -1 = all
  seed: 42
  paper_split_counts: {train: 15625, validation: 5251, test: 5112}      # Karaman et al. 2023
  notebook_split_counts: {train: 15625, validation: 5112, test: 5251}   # upstream DatasetAnalysis.ipynb
  geo_pattern: "lat|lon|^x$|^y$|geom|crs|coord|bound|transform"
  geo_extensions: [".geojson", ".json", ".shp", ".gpkg", ".kml", ".csv", ".tif", ".tiff"]
