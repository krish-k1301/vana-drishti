# Dated early-detection set (Phase 3 export, Phase 4 training). Paths are relative to the repo root.
dataset: dated
root: data/dated_amazon          # Phase 3 GEE export output in BraDD format (not yet produced)
split_column: dated_set          # spatial split by region block
stats_path: data/dated_amazon/vanadrishti_dated_train_stats.pt
normalization: zscore
batch_size: 4
num_workers: 4
temporal_subsample:
  mode: none
  num_dates: -1
  at_test: false
max_samples:
  train: null
  validation: null
  test: null
prefix_truncation:
  anchor: deter                  # deter | burn (trained separately, PRD Phase 4)
  min_dates: 4                   # images required at or before the cutoff
  label_interval_days: 30        # cumulative label spacing, last label exactly at the cutoff
  phases: [train]                # validation/test use sliding prefixes in Phase 5 (prefix_at)
per_region_norm:                 # PRD 4.3 (SN-TUNet); replaces the global Z-score when enabled
  enabled: false
  region_column: state           # do NOT enable until gee/plan.py gives negatives their UF (now all "amazon": label leak)
  stats_path: data/dated_amazon/vanadrishti_dated_train_region_stats.pt
  unseen_region: global          # global | self | error, for regions without train rows
  self_normalise_regions: []     # regions always normalised from their own (unlabelled) images
seasonal_window:                 # PRD 4.3; filters images only, labels intact; applied before temporal_subsample
  enabled: false
  start: "06-01"                 # MM-DD; start > end wraps the year end
  end: "10-31"
  on_empty: error                # error | skip (skip drops such samples when the dataset is built)
crop:                            # PRD Phase 6 smaller patches
  enabled: false
  size: 32                       # 32 | 16
  mode: center                   # center | random (train only; center elsewhere) | tile (48/16 -> 9 disjoint, 48/32 -> 4 overlapping corners)
  input_size: 48
label_source: prodes             # prodes (sample key `label`) | hansen (`label_hansen`); or {train: .., validation: .., test: ..}
