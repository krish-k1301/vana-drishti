# Tier A benchmark (PRD 6): ConvGRU, padding-aware wrapper src/models/recurrent.py::MaskedConvGRUSeg.
# Loss and training recipe inherited: focal alpha 0.75, gamma 1.0.
base: ../baseline_utae_focal.yaml
experiment_name: convgru

model:
  name: convgru
  params:
    _replace: true
    num_classes: 2        # binary change map, as UTAE out_conv[-1]
    input_size: [48, 48]  # BraDD patch size; upstream ConvGRU_Seg default (48, 48)
    input_dim: 2          # VV, VH; upstream ConvGRU_Seg default
    hidden_dim: 180       # upstream ConvGRU_Seg default; same in utae-paps model_utils.py
    kernel_size: [3, 3]   # upstream default; only 3x3 supported (head conv hard-codes padding=1)
    pad_value: 0          # upstream default; must match SegmentNetwork zero padding
