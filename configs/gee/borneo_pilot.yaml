# Phase 6 (PRD 7): Borneo pilot, same pipeline as Phase 3, BraDD-compatible output (.orchestrator/INTERFACES.md).
# Run: python gee/run_export.py --config configs/gee/borneo_pilot.yaml --pilot   (full run only after pilot QA passes)
# Anything marked VERIFY is unconfirmed and must be checked against the source before an export.
name: borneo_pilot
region_label: borneo   # meta.csv `state` for every patch (no DETER state outside Brazil)
placeholder_prefix: VERIFY_     # values starting with this make the CLI refuse to run

paths:                          # sub-paths inside each mode's out_root (modes below)
  raw_subdir: raw               # pulled arrays (npz / mirrored batch CSV), sidecar JSON, plan, task log
  qa_subdir: qa
  task_log: task_log.jsonl
  plan: plan.csv

s1:
  collection: COPERNICUS/S1_GRD   # already dB after GEE default chain (thermal noise, calibration, terrain correction)
  instrument_mode: IW
  resolution_meters: 10
  polarisations: [VV, VH]
  # Property `platform_number`. Sentinel-1B failed Dec 2021: 2022+ windows are 12-day revisit (recorded per patch).
  # VERIFY: Sentinel-1C availability (and its platform_number value 'C') in COPERNICUS/S1_GRD for 2025+ before adding.
  platforms: [A, B]
  # Tie-break only, when two relative orbits have the same number of dates. VERIFY which pass BraDD-S1TS used.
  pass_preference: [DESCENDING, ASCENDING]
  nodata: -9999.0                 # fill for pixels with no data; such dates are dropped at conversion

window:                           # PRD Phase 3: ~12 months before to ~4 months after the event date
  days_before: 365
  days_after: 120

grid:
  patch_size: 48                  # 48 x 48 px = 480 m, like BraDD
  pixel_size_m: 10

events:
  source: hansen                  # no DETER outside Brazil: Hansen loss alone selects and dates events
  # Positives: points with Hansen loss in the period years. Event date = 31 Dec of the loss year (the earliest date
  # an annual product can know the loss: causal-safe, 1-year resolution). Labels = Hansen loss dated the same way.
  # RADD is never used to select or date events (PRD 5); radd_date is kept per pixel for latency-vs-RADD only, and
  # RADD-missed events stay in the set.
  # VERIFY RADD coverage start for this region (only matters for the radd_date attribute).
  period_start: "2021-01-01"
  period_end: "2023-12-31"
  positive_class_label: hansen_loss   # stored in the deter_class field

labels:
  pull: [radd, hansen, modis]       # label bands pulled from Earth Engine per patch
  radd:
    collection: projects/radar-wur/raddalert/v1
    layer_property: layer         # VERIFY property name/value selecting alert images (vs forest baseline)
    layer_value: alert
    geoidx_property: geoidx       # VERIFY property name/value of the insular Southeast Asia (VERIFY value) region
    geoidx_value: asia
    alert_band: Alert             # 2 = unconfirmed, 3 = confirmed (GFW docs)
    date_band: Date               # VERIFY: YYDDD, YY = years since base_year (GFW docs; decode in gee/dates.py)
    base_year: 2000
  hansen:                         # labels (Phase 6), label_hansen and the negative-class image
    asset: UMD/hansen/global_forest_change_2025_v1_13
    lossyear_band: lossyear       # 1-25 = 2001-2025
    treecover_band: treecover2000
    base_year: 2000
  modis:
    collection: MODIS/061/MCD64A1
    band: BurnDate                # 500 m: patch-level flag only (PRD 5)

states: null                      # no sub-national regions: every patch gets region_label as `state`

negatives:
  # BraDD-S1TS counts used as type weights (PRD 5): oldDeforest 7557, forest 5472, herbaceous 1780,
  # agriculture 152, shrubs 21 -> 14982 negatives for 8712 positives (ratio 1.72). BraDD `boundary` is not built.
  ratio: 1.72
  type_weights: {oldDeforest: 7557, forest: 5472, herbaceous: 1780, agriculture: 152, shrubs: 21}
  # Classes come from Hansen + ESA WorldCover (no PRODES/MapBiomas outside Brazil). Negatives whose patch shows
  # Hansen loss inside the window are rejected at conversion.
  nonforest_classes: {herbaceous: 30, agriculture: 40, shrubs: 20}   # ESA WorldCover v200 class codes
  worldcover: {collection: ESA/WorldCover/v200, band: Map, tree_class: 10}
  forest_treecover_min: 80        # stable forest: treecover2000 >= this, no Hansen loss through 2025
  nonforest_treecover_max: 10
  sample_scale_m: 30
  oversample: 3                   # candidates drawn per wanted negative (boundary/event filters drop some)
  tile_scale: 4

split:
  block_size_deg: 0.5             # region blocks; patches crossing a block edge are dropped
  seed: 42
  fractions: {train: 0.7, validation: 0.15, test: 0.15}
  # >= patch diagonal 480*sqrt(2) = 679 m (checked at load) so no two kept patches overlap, in any split or class,
  # and no event is counted twice; +~14 m for the 10 m grid snapping of both centres -> 700 m.
  min_center_distance_m: 700

modes:
  pilot:
    bbox: [112.5, -2.5, 113.5, -1.5]   # Central Kalimantan (Katingan / Kotawaringin Timur): plantation frontier; 4 blocks
    max_positives: 30
    out_root: data/dated_borneo_pilot     # BraDD-format root: meta.csv, Samples/, raw/, qa/
  full:
    bbox: [108.5, -4.5, 119.5, 7.5]   # Borneo island envelope
    max_positives: 5000
    out_root: data/dated_borneo           # BraDD-format root read by the data loaders

export:
  backend: {pilot: direct, full: batch}   # direct = ee.data.computePixels; batch = Export.table CSV per patch
  max_attempts: 3
  max_pending_tasks: 2500         # VERIFY current Earth Engine batch queue quota for the project
  batch:
    destination: gcs              # gcs or drive; mirror outputs into <root>/full/raw (gsutil -m rsync) to convert
    bucket: VERIFY_GCS_BUCKET
    prefix: vanadrishti/borneo_pilot
    drive_folder: vanadrishti_borneo_pilot

qa:
  vv_range: [-30.0, 5.0]
  vh_range: [-35.0, 0.0]
  max_out_of_range_fraction: 0.01
  vv_median_range: [-20.0, -2.0]  # catches linear-scale (non-dB) data
  t_range: [15, 90]               # 486-day window, one orbit: ~41 dates at 12 days, ~81 at 6 days
  max_gap_days: 48
  min_positives: 10
  max_failed_fraction: 0.05
  spot_check_size: 20             # random positives listed for the owner's NICFI spot-check
