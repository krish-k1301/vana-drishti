# SMOKE Phase 2 benchmark run of configs/models/galileo.yaml on the synthetic BraDD set, 2 epochs on CPU.
# Synthetic data, CPU, 2 epochs: proves the pipeline runs end to end, reproduces nothing.
base: ../models/galileo.yaml
experiment_name: smoke_bench_galileo
smoke: true

data:
  root: data/synthetic_bradd
  stats_path: data/synthetic_bradd/vanadrishti_close_train_stats.pt
  num_workers: 2
  max_samples:  # SMOKE deviation: train subset only (5.4 s/batch measured on this 4-core CPU; ~20 min budget per model)
    train: 250

trainer:
  max_epochs: 2
  accelerator: cpu
  enable_progress_bar: false
